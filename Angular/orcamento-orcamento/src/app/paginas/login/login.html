<div class="form">
    <form [formGroup]="loginForm" (submit)="submitLogin2()">
        <h2>Longin no sistema</h2>
        <label for="login">Login: </label>
        <input type="text" id="login" name="login" formControlName="login" placeholder="Informe seu login">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" formControlName="pass">
        <button (click)="confirmLogin()">Enviar</button>
    </form>
